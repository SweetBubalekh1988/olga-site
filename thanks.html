<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо! | Ольга Знатнова</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .thanks-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F5F0E8 0%, #e8e0d0 100%);
            text-align: center;
            padding: 20px;
        }
        .thanks-content {
            max-width: 600px;
            background: #fff;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .thanks-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .thanks-content h1 {
            color: #1F3A5F;
            font-size: 32px;
            margin-bottom: 15px;
        }
        .thanks-content p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .thanks-btn {
            display: inline-block;
            padding: 14px 32px;
            background: #E87A3E;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .thanks-btn:hover {
            background: #d06a30;
        }
    </style>
</head>
<body>
    <div class="thanks-page">
        <div class="thanks-content">
            <div class="thanks-icon">✅</div>
            <h1>Спасибо!</h1>
            <p>Ваше сообщение отправлено. Ольга свяжется с вами в ближайшее время.</p>
            <a href="index.html" class="thanks-btn">Вернуться на главную</a>
        </div>
    </div>
</body>
</html>
